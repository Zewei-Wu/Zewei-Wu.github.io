current:
  - title: "High-resolution Hydrodynamic Simulations of Ultra-Faint Milky Way Satellites"
    mentor: "PIs: Ethan Nadler & Michael Norman | Nadler Group | UCSD"
    image: "images/research_ufd.jpeg"
    alt: "Milky Way-est volume"
    caption: "Region containing the Milky Way-est volume"
    creditName: "Ethan Nadler"
    bullets:
      - "Develop a cosmological zoom-in simulation framework with the AMR code [ENZO](https://enzo-project.org/) to resolve ultra-faint dwarf galaxies (UFDs) at ~10 M⊙ stellar mass and parsec-scale spatial resolution, while following their evolution in realistic Milky Way–like environments down to z = 0. UFDs occupy the lowest-mass halos that host stars, making for great astrophysical probe of the galaxy formation threshold and of dark matter physics."
      - "Implement multi-region Lagrangian “must-refine” tracking on 100 independent dwarf halos per host, on [Milky Way-est](https://ui.adsabs.harvard.edu/abs/2024ApJ...971...79B/abstract) initial conditions that reproduce the MW's halo mass, merger history, and LMC analog accretion. Port and validate [StarNet](https://ui.adsabs.harvard.edu/abs/2022ApJ...932...71W/abstract), a machine-learning surrogate model for Population III star formation, coupled to ENZO via [libyt](https://github.com/yt-project/libyt) for in-situ supernova feedback deposition."
      - "Forward-model resulting UFD population: occupation fractions, luminosity functions, sizes, chemistry, and kinematics for comparison with LSST, Roman, and JWST."
    links:
      - label: "Fields NFC poster"
        href: "/files/26_FieldsNFC_ZeweiWu.pdf"
      - label: "Paper in prep"
        href: ""

  - title: "Semi-Analytical Models (SAM) of the Lyman Continuum (LyC) Escape Fraction"
    mentor: "Mentor: Andrey Kravtsov | Structure Formation Group | UChicago"
    image: "images/research_lyman_cont.jpg"
    alt: "Lyman Continuum Leaker"
    caption: "A Possible Lyman-Continuum Leaker"
    creditName: "ESO/M. Kornmesser"
    creditHref: "https://ras.ac.uk/events-and-meetings/ras-meetings/production-and-escape-lyman-photons-through-time-and-space"
    bullets:
      - "Using the previously developed [semi-analytical model GRUMPY](https://github.com/kibokov/GRUMPY) to simulate UV luminosity functions and ionizing flux for high-redshift dwarf galaxies in the Epoch of Reionization (EOR), at the James Webb (JWST) observational limits."
      - "Developing novel methods on halo sampling and star formation stochasticity to test the evolution of Lyman continuum escape fraction with redshift and galaxy properties, such as luminosity, mass, metallicity, etc."
    links:
      - label: "Paper on arxiv"
        href: "https://arxiv.org/abs/2511.07543"
      - label: "Poster"
        href: "/files/URS2024_Jason_Wu.pdf"

  - title: "Hydrodynamical Models of Turbulent Three-Phase Gas in the CGM"
    mentor: "Mentor: Hitesh Kishore Das & Max Grönke | Multiphase Gas Group | Max Planck Institute for Astrophysics"
    image: "images/research_multiphase_gas.gif"
    alt: "Multiphase Gas"
    caption: "A Multiphase Gas Simulation"
    creditName: "Hitesh and myself"
    creditHref: "https://hiteshkishoredas.github.io/research/mhd_multiphase.html"
    bullets:
      - "Develop [three-phase astrophysical plasma](https://hiteshkishoblueas.github.io/research/mhd_multiphase.html) simulation [code](https://github.com/HiteshKishoblueas/athena_fork_turb_box) with temperature spanning 5 orders of magnitude. Running three-phase gas simulations with turbulence driving is an underexplored area in literature, and it is vital to a more realistic understanding of the circumgalactic medium (CGM)."
      - "High-performance computing with [ATHENA++](https://www.athena-astro.app/) using the “Freya” supercomputer at MPA."
    links:
      - label: "DAAD RISE Meeting presentation"
        href: "https://docs.google.com/presentation/d/1d1-dowqR7uNBQBZE4m-lbpvv-WdLRdtXbc-vRsJCnpU/edit?usp=sharing"
      - label: "Paper in prep"
        href: ""

