note: "Last updated 2025, please check CV for more up-to-date research information"

summary:
  - "My research is centered on the exploration of theoretical astrophysics, with a particular emphasis on structure formation in the smallest galaxies, and modeling the physical properties of our universe. I am actively involved in [Prof. Ethan Nadler's research group](https://eonadler.github.io/group.html) at University of California San Diego, as well as the [Structure Formation Research Group](https://astrophysics.uchicago.edu/people/profile/andrey-v.-kravtsov/) at the University of Chicago, and the [Multiphase Gas Group](https://www.mpa-garching.mpg.de/1020167/multiphase-gas) at the Max Planck Institute for Astrophysics."
  - "I use astrophysical observations on the smallest scales to probe the most fundamental questions in cosmology, such as the nature of dark matter and dark energy. As such, I was also involved in the [COOL-LAMPS collaboration](https://coollamps.github.io/) for its work on strong lensing, as well as of the [LSST science collaboration](https://lsstdiscoveryalliance.org/lsst-science-collaborations/), where I use dwarf galaxies and stellar streams to uncover dark matter mini-halos. My ultimate goal is to unravel the tapestry of our universe, one galaxy at a time."

